<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" role="img" aria-label="AUC against share of patients from scanner 1" style="width:100%;height:auto;font-family:system-ui,sans-serif">
<rect width="700" height="370" fill="#fcfcfb"/>
