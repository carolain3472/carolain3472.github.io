<circle cx="270.0" cy="81.3" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>Scanner unrelated to disease, 70%: AUC 0.92</title></circle>
<circle cx="375.0" cy="136.6" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>Scanner unrelated to disease, 80%: AUC 0.81</title></circle>
