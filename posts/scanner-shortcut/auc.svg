<line x1="60" x2="480" y1="196.0" y2="196.0" stroke="#e4e3df"/><text x="50" y="200.0" font-size="12" text-anchor="end" fill="#52514e">0.7</text>
<line x1="60" x2="480" y1="144.0" y2="144.0" stroke="#e4e3df"/><text x="50" y="148.0" font-size="12" text-anchor="end" fill="#52514e">0.8</text>
<line x1="60" x2="480" y1="92.0" y2="92.0" stroke="#e4e3df"/><text x="50" y="96.0" font-size="12" text-anchor="end" fill="#52514e">0.9</text>
<line x1="60" x2="480" y1="40.0" y2="40.0" stroke="#e4e3df"/><text x="50" y="44.0" font-size="12" text-anchor="end" fill="#52514e">1.0</text>
<text x="60" y="322" font-size="12" text-anchor="middle" fill="#52514e">50%</text>
