<text x="375" y="322" font-size="12" text-anchor="middle" fill="#52514e">80%</text>
<text x="480" y="322" font-size="12" text-anchor="middle" fill="#52514e">90%</text>
<text x="270" y="350" font-size="13" text-anchor="middle" fill="#52514e">Patients that come from scanner 1</text>
<polyline fill="none" stroke="#2a78d6" stroke-width="2" points="60.0,54.3 165.0,55.2 270.0,59.7 375.0,63.2 480.0,56.6"/>
<circle cx="60.0" cy="54.3" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>Same scanner mix as in training, 50%: AUC 0.97</title></circle>
<circle cx="165.0" cy="55.2" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>Same scanner mix as in training, 60%: AUC 0.97</title></circle>
