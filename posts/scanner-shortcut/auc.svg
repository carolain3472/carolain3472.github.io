<circle cx="480.0" cy="56.6" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>Same scanner mix as in training, 90%: AUC 0.97</title></circle>
<circle cx="502" cy="52.6" r="4" fill="#2a78d6"/><text x="514" y="56.6" font-size="13" fill="#0b0b0b">Same scanner mix<tspan x="514" dy="17">as in training</tspan><tspan x="514" dy="17" font-weight="600">AUC 0.97</tspan></text>
<polyline fill="none" stroke="#eb6834" stroke-width="2" points="60.0,57.0 165.0,60.1 270.0,81.3 375.0,136.6 480.0,199.9"/>
<circle cx="60.0" cy="57.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>Scanner unrelated to disease, 50%: AUC 0.97</title></circle>
