<circle cx="502" cy="52.6" r="4" fill="#2a78d6"/><text x="514" y="56.6" font-size="13" fill="#0b0b0b">Igual mezcla de<tspan x="514" dy="17">escáneres</tspan><tspan x="514" dy="17" font-weight="600">AUC 0,97</tspan></text>
