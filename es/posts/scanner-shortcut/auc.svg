<circle cx="165.0" cy="60.1" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>Escáner sin relación con la enfermedad, 60%: AUC 0,96</title></circle>
<circle cx="270.0" cy="81.3" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>Escáner sin relación con la enfermedad, 70%: AUC 0,92</title></circle>
